name: ci

on:
  push:
    branches: ['**']
    tags: ['release/v*', 'dev/v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # tags and the default branch publish images; never cancel those mid-push
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref_name != github.event.repository.default_branch }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f  # v1.5.12
      # one quoted command line, since sbt 2's client joins separate arguments into one command; testFull, since
      # sbt 2's test can answer from cached results
      - run: sbt "scalafmtCheckAll; scalafmtSbtCheck; testFull"

  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: ./Dockerfile

  image-scan:
    # no image is built before the tests and the dockerfile lint pass
    needs: [test, hadolint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ci:${{ github.sha }}
          build-args: |
            CI_COMMIT=${{ github.sha }}
            CI_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ci:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  publish:
    needs: [test, hadolint, image-scan]
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    # the secrets context is not allowed in a step-level if, so hoist it to env to gate on
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker hub is optional: unset secrets leave a fork publishing to ghcr only
      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            name=ghcr.io/${{ github.repository }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME || 'unconfigured' }}/gost-mtls-proxy,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # latest=auto would hand :latest to every match tag, dev/ included
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=match,pattern=^release/v(\d+\.\d+\.\d+(?:-[\w.]+)?)$,group=1
            type=match,pattern=^release/v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^dev/v(\d+\.\d+\.\d+(?:-[\w.]+)?)$,group=1,suffix=-dev
            type=sha,format=short,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/release/v') && !contains(github.ref_name, '-') }}
      # arm64 is qemu-emulated, long build
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CI_COMMIT=${{ github.sha }}
            CI_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
